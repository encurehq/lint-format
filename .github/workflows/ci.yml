name: CI

on:
  pull_request:
  # The Release workflow dispatches this on the release PR branch: PRs opened with GITHUB_TOKEN start no pull_request runs.
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run verify
