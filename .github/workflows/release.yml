name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish again, for example v0.2.0
        required: true

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # workflow_dispatch is the one trigger GITHUB_TOKEN may fire, so this is how the required check reaches the release PR.
      - name: Run CI on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName || 'release-please--branches--main--components--lint-format' }}

  # Publishing runs here, not on the tag push: a tag created with GITHUB_TOKEN does not trigger other workflows.
  publish:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - name: Tag matches package version
        run: test "v$(bun -p "require('./package.json').version")" = "${RELEASE_TAG#lint-format-}"
      - run: bun run build
      - run: bun run verify
      - name: Check npm token
        run: |
          test -n "${NPM_TOKEN}" || { echo "NPM_TOKEN secret is missing or empty"; exit 1; }
          code=$(curl -sS -o whoami.json -w '%{http_code}' -H "Authorization: Bearer ${NPM_TOKEN}" https://registry.npmjs.org/-/whoami)
          echo "npm whoami status: ${code}"
          echo "npm user: $(bun -p "const j=require('./whoami.json'); j.username ?? j.error ?? ''")"
          rm whoami.json
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Authenticate to npm
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: timeout 120 bun publish --access public < /dev/null
